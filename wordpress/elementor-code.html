<!-- ==============================================================================
     PERALIYA '26 - TRUE FULL WIDTH & FULL HEIGHT WORDPRESS ELEMENTOR EMBED
     Target: https://akensanketh.github.io/peraliya
     Features:
     - 100% Full Width (100vw) & Full Height (100vh / 100dvh)
     - Overrides any WordPress theme headers, footers, paddings, and margins
     - Zero double-scrollbars
     - Preserves Elementor Editor controls when in Edit mode
============================================================================== -->

<div id="peraliya-fullscreen-wrapper" class="peraliya-fullscreen-wrapper">
  <!-- Elegant Preloader -->
  <div id="peraliya-loader" class="peraliya-loader">
    <div class="peraliya-spinner"></div>
    <div class="peraliya-loader-text">Loading Peraliya '26...</div>
  </div>

  <!-- Fullscreen Iframe -->
  <iframe
    id="peraliya-frame"
    class="peraliya-frame"
    src="https://akensanketh.github.io/peraliya"
    title="Peraliya '26 — All-Island Inter-School Media Competition"
    frameborder="0"
    scrolling="yes"
    allow="clipboard-write; fullscreen; geolocation"
    loading="eager"
  ></iframe>
</div>

<style>
  /* 1. Global Reset to eliminate theme margins & scroll glitches */
  html, body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100% !important;
    height: 100% !important;
    overflow: hidden !important;
  }

  /* 2. Remove Elementor default spacing around HTML widget */
  .elementor,
  .elementor-section,
  .elementor-container,
  .elementor-column,
  .elementor-widget-wrap,
  .elementor-widget-html,
  .elementor-widget-container {
    margin: 0 !important;
    padding: 0 !important;
    max-width: 100% !important;
    width: 100% !important;
    height: 100% !important;
  }

  /* 3. True Fullscreen Fixed Container (100vw x 100vh) */
  .peraliya-fullscreen-wrapper {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    height: 100dvh !important;
    margin: 0 !important;
    padding: 0 !important;
    border: none !important;
    z-index: 99999 !important; /* Above any WordPress theme header/footer */
    background: #0b0f19;
    overflow: hidden;
  }

  /* 4. Complete Edge-to-Edge Iframe */
  .peraliya-frame {
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    min-width: 100% !important;
    min-height: 100% !important;
    border: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
    outline: none !important;
    display: block !important;
    background: #0b0f19;
    z-index: 1;
    -webkit-overflow-scrolling: touch;
  }

  /* 5. Smooth Preloader */
  .peraliya-loader {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #111827 0%, #080c14 100%);
    color: #f3f4f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    z-index: 2;
    transition: opacity 0.4s ease, visibility 0.4s ease;
  }

  .peraliya-loader.loaded {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .peraliya-spinner {
    width: 50px;
    height: 50px;
    border: 3px solid rgba(255, 255, 255, 0.12);
    border-top-color: #f59e0b;
    border-right-color: #3b82f6;
    border-radius: 50%;
    animation: peraliyaRotate 0.85s linear infinite;
    margin-bottom: 14px;
  }

  .peraliya-loader-text {
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #94a3b8;
    font-weight: 500;
  }

  @keyframes peraliyaRotate {
    to { transform: rotate(360deg); }
  }

  /* 6. Friendly display inside Elementor Editor mode so you can still edit */
  body.elementor-editor-active .peraliya-fullscreen-wrapper {
    position: relative !important;
    height: 90vh !important;
    z-index: 1 !important;
  }
  body.elementor-editor-active html,
  body.elementor-editor-active body {
    overflow: auto !important;
  }
</style>

<script>
  (function() {
    var iframe = document.getElementById('peraliya-frame');
    var loader = document.getElementById('peraliya-loader');
    var wrapper = document.getElementById('peraliya-fullscreen-wrapper');

    // Remove preloader once website is loaded
    if (iframe && loader) {
      iframe.addEventListener('load', function() {
        setTimeout(function() {
          loader.classList.add('loaded');
        }, 250);
      });

      // Backup fail-safe
      setTimeout(function() {
        if (loader && !loader.classList.contains('loaded')) {
          loader.classList.add('loaded');
        }
      }, 3000);
    }

    // Dynamic viewport height adjustments for iOS Safari and mobile Chrome address bars
    function syncViewport() {
      if (wrapper && !document.body.classList.contains('elementor-editor-active')) {
        wrapper.style.height = window.innerHeight + 'px';
      }
    }

    window.addEventListener('resize', syncViewport);
    window.addEventListener('orientationchange', syncViewport);
    syncViewport();
  })();
</script>
